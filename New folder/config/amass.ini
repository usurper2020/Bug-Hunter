# Amass Configuration

# General settings
output: "amass_output.txt"
threads: 10
max_depth: 2
timeout: 30

# DNS settings
dns:
  enabled: true
  resolvers:
    - "1.1.1.1"
    - "8.8.8.8"

# API keys
api_keys:
  shodan: "YOUR_SHODAN_API_KEY"
  crtsh: "YOUR_CRTSH_API_KEY"

# Logging settings
log:
  level: "INFO"
  file: "amass.log"
